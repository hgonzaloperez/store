<div class="w-full max-w-sm bg-neutral-primary-soft p-6 border border-default rounded-base shadow-xs">
    <a [routerLink]="['/product', product().id]">
          <img [src]="product().images?.[0] || 'https://via.placeholder.com/400x160?text=No+Image'" [alt]="product().title" width="400" height="160" class="w-full h-40 object-cover rounded-base" />
    </a>
    <div>
        <span class="bg-brand-softer border border-brand-subtle text-fg-brand-strong text-xs font-medium px-1.5 py-0.5 rounded-sm">4.8 out of 5</span>
        </div>
        <a href="#">
            <h5 class="text-xl text-heading font-semibold tracking-tight">{{product().title | uppercase}}</h5>
        </a>
        <div class="flex items-center justify-between mt-6">
            <span class="text-3xl font-extrabold text-heading">{{product().price | currency:'$' : 'symbol' : '1.00'}}</span>
<button type="button" (click)="onAddToCart()"
class="inline-flex items-center bg-blue-500 hover:bg-blue-700 box-border border border-transparent focus:ring-4 focus:ring-blue-300 shadow-xs font-medium leading-5 rounded-base text-sm px-3 py-2 focus:outline-none">

<svg class="w-4 h-4 me-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"/>
</svg>

Add to cart
</button>
        </div>
    </div>
